services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_MERCURE_URL: ${VITE_MERCURE_URL:-http://localhost:3001/.well-known/mercure}
        VITE_APP_NAME: ${VITE_APP_NAME:-TOA Platform}
    ports:
      - "127.0.0.1:8092:80"
    restart: unless-stopped
