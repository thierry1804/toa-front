    <ellipse cx="220" cy="400" rx="6" ry="6" fill="#9ca3af" stroke="none"/>
    <path d="M236 400 L255 400" stroke="#6b7280" stroke-width="2"/>
    <ellipse cx="320" cy="450" rx="14" ry="14" fill="none" stroke="#6b7280" stroke-width="2"/>
