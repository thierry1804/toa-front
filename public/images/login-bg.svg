<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#f3f6f8"/>
      <stop offset="100%" stop-color="#e4ebef"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c5cc"/>
      <stop offset="100%" stop-color="#8fa0a9"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d9a72"/>
      <stop offset="100%" stop-color="#5c7454"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a754f"/>
      <stop offset="100%" stop-color="#3f5438"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6344"/>
      <stop offset="100%" stop-color="#2f3f2c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="45%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Soft cloud wisps (very light) -->
  <g fill="#dbe4ea" opacity="0.35">
    <ellipse cx="320" cy="210" rx="120" ry="28"/>
    <ellipse cx="400" cy="205" rx="90" ry="22"/>
    <ellipse cx="1480" cy="180" rx="140" ry="26"/>
    <ellipse cx="1580" cy="175" rx="100" ry="20"/>
  </g>

  <!-- Far mountains -->
  <path fill="url(#far)" opacity="0.5" d="M0 640 L180 560 L340 610 L520 520 L700 590 L900 500 L1100 580 L1280 510 L1500 575 L1700 530 L1920 590 L1920 1080 L0 1080 Z"/>

  <!-- Mid rolling hills -->
  <path fill="url(#mid)" d="M0 760 C160 720 320 745 480 730 C700 710 860 760 1080 735 C1280 715 1480 755 1680 740 C1800 732 1880 745 1920 750 L1920 1080 L0 1080 Z"/>

  <!-- Near hills -->
  <path fill="url(#near)" d="M0 860 C200 825 400 850 620 835 C900 810 1120 860 1400 840 C1620 825 1780 850 1920 845 L1920 1080 L0 1080 Z"/>

  <!-- Foreground meadow -->
  <path fill="url(#ground)" d="M0 960 C280 935 560 955 880 945 C1200 932 1500 960 1920 950 L1920 1080 L0 1080 Z"/>

  <!-- Tree silhouettes (mid distance) -->
  <g fill="#3a4f36" opacity="0.55">
    <path d="M140 790 L155 730 L170 790 Z"/><rect x="150" y="785" width="6" height="18" rx="1"/>
    <path d="M420 805 L438 735 L456 805 Z"/><rect x="433" y="800" width="7" height="20" rx="1"/>
    <path d="M1180 815 L1198 745 L1216 815 Z"/><rect x="1193" y="810" width="7" height="18" rx="1"/>
    <path d="M1750 800 L1768 728 L1786 800 Z"/><rect x="1763" y="795" width="7" height="20" rx="1"/>
    <path d="M1820 812 L1835 755 L1850 812 Z"/><rect x="1830" y="808" width="5" height="14" rx="1"/>
  </g>

  <!-- Grass strokes foreground -->
  <g stroke="#2a3828" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <path d="M40 1000 l4 -14 M70 1010 l-3 -12 M110 998 l5 -15 M160 1015 l-4 -13 M210 1005 l3 -14"/>
    <path d="M1680 1010 l4 -13 M1720 1000 l-3 -14 M1780 1015 l5 -12 M1840 1005 l-4 -15 M1880 1012 l3 -13"/>
  </g>

  <!-- Conductors -->
  <g fill="none" stroke="#6b7280" stroke-linecap="round" filter="url(#soft)">
    <path d="M210 455 C520 510 860 470 1160 500 C1400 520 1600 470 1730 430" stroke-width="1.6" stroke-opacity="0.55"/>
    <path d="M210 470 C520 525 860 485 1160 515 C1400 535 1600 485 1730 445" stroke-width="1.3" stroke-opacity="0.4"/>
    <path d="M340 455 C600 495 900 455 1200 485 C1450 510 1620 460 1730 430" stroke-width="1.4" stroke-opacity="0.45"/>
  </g>

  <!-- PYLON LEFT -->
  <g stroke="url(#steel)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M200 955 L250 410" stroke-width="2.4"/>
    <path d="M340 955 L290 410" stroke-width="2.4"/>
    <!-- horizontal members -->
    <path d="M208 900 L332 900 M212 840 L328 840 M218 780 L322 780 M224 720 L316 720 M232 660 L308 660 M240 600 L300 600 M248 540 L292 540 M254 480 L286 480" stroke-width="1.8"/>
    <!-- X braces -->
