    <!-- waist -->
    <path d="M235 560 L305 560" stroke-width="2"/>
    <!-- crossarm -->
    <path d="M165 430 L375 430 M165 448 L375 448" stroke-width="2.6"/>
    <path d="M165 430 L165 460 M375 430 L375 460 M250 410 L250 460 M290 410 L290 460" stroke-width="2"/>
    <!-- peak -->
    <path d="M250 410 L270 372 L290 410" stroke-width="2.2"/>
    <!-- insulator strings -->
    <g stroke="#4b5563" stroke-width="2">
      <path d="M185 448 L185 478"/><circle cx="185" cy="458" r="3" fill="#9ca3af" stroke="none"/>
      <path d="M270 448 L270 478"/><circle cx="270" cy="458" r="3" fill="#9ca3af" stroke="none"/>
      <path d="M355 448 L355 478"/><circle cx="355" cy="458" r="3" fill="#9ca3af" stroke="none"/>
    </g>
  </g>
  <ellipse cx="270" cy="958" rx="95" ry="11" fill="#111827" opacity="0.14"/>

  <!-- PYLON MID (smaller / farther) -->
  <g stroke="#4b5563" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M980 880 L1005 560" stroke-width="1.6"/>
    <path d="M1060 880 L1035 560" stroke-width="1.6"/>
    <path d="M984 840 L1056 840 M987 800 L1053 800 M991 760 L1049 760 M996 720 L1044 720 M1000 680 L1040 680 M1004 640 L1036 640 M1008 600 L1032 600" stroke-width="1.2"/>
    <path d="M984 840 L1056 800 M1056 840 L984 800 M987 800 L1053 760 M1053 800 L987 760 M991 760 L1049 720 M1049 760 L991 720 M996 720 L1044 680 M1044 720 L996 680 M1000 680 L1040 640 M1040 680 L1000 640 M1004 640 L1036 600 M1036 640 L1004 600" stroke-width="1"/>
    <path d="M960 575 L1080 575 M960 588 L1080 588" stroke-width="1.6"/>
    <path d="M1005 560 L1020 538 L1035 560" stroke-width="1.4"/>
  </g>

  <!-- PYLON RIGHT -->
  <g stroke="url(#steel)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M1560 970 L1610 360" stroke-width="2.4"/>
    <path d="M1720 970 L1670 360" stroke-width="2.4"/>
    <path d="M1568 910 L1712 910 M1572 850 L1708 850 M1578 790 L1702 790 M1586 730 L1694 730 M1594 670 L1686 670 M1602 610 L1678 610 M1608 550 L1672 550 M1614 490 L1666 490 M1618 430 L1662 430" stroke-width="1.8"/>
    <path d="M1568 910 L1712 850 M1712 910 L1568 850 M1572 850 L1708 790 M1708 850 L1572 790 M1578 790 L1702 730 M1702 790 L1578 730 M1586 730 L1694 670 M1694 730 L1586 670 M1594 670 L1686 610 M1686 670 L1594 610 M1602 610 L1678 550 M1678 610 L1602 550 M1608 550 L1672 490 M1672 550 L1608 490 M1614 490 L1666 430 M1666 490 L1614 430" stroke-width="1.5"/>
    <path d="M1595 520 L1685 520" stroke-width="2"/>
    <path d="M1520 385 L1760 385 M1520 404 L1760 404" stroke-width="2.6"/>
    <path d="M1520 385 L1520 418 M1760 385 L1760 418 M1610 360 L1610 418 M1670 360 L1670 418" stroke-width="2"/>
    <path d="M1610 360 L1640 318 L1670 360" stroke-width="2.2"/>
    <g stroke="#4b5563" stroke-width="2">
      <path d="M1545 404 L1545 438"/><circle cx="1545" cy="416" r="3" fill="#9ca3af" stroke="none"/>
      <path d="M1640 404 L1640 438"/><circle cx="1640" cy="416" r="3" fill="#9ca3af" stroke="none"/>
      <path d="M1735 404 L1735 438"/><circle cx="1735" cy="416" r="3" fill="#9ca3af" stroke="none"/>
    </g>
  </g>
  <ellipse cx="1640" cy="975" rx="115" ry="12" fill="#111827" opacity="0.14"/>
</svg>
